<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/images/favicon.png">
<meta name="theme-color" content="#0f0c19">
<title>404 · ONEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bowlby+One&family=Familjen+Grotesk:wght@400;500;700&family=Special+Elite&family=Rubik+Mono+One&family=Playfair+Display:ital,wght@1,900&display=swap">
<link rel="stylesheet" href="/assets/css/style.css?v=66">
<style>
  /* 404: Geppetto's workshop at night. A "wanted" poster for the lost page, Pinokkio looking around, the night sky.
     Everything fits one screen: no scrolling. */
  html,body{height:100%;overflow:hidden}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%)}
  .scene{position:relative;height:100svh;display:grid;justify-items:center;align-content:center;gap:clamp(8px,2vh,20px);padding:70px 20px 24px;text-align:center;overflow:hidden}
  .lang404{position:fixed;top:16px;right:16px;margin:0;z-index:5}
  .home404{position:fixed;top:14px;left:16px;z-index:5;display:block}
  .home404 img{height:46px;width:auto;display:block}

  /* hanging 404 */
  .big404{font-size:min(clamp(46px,10vw,104px),11vh);--g:clamp(10px,2vw,22px);justify-content:center;padding-top:clamp(46px,8vw,76px);position:relative;margin:0}
  .big404::before{content:"";position:absolute;top:clamp(8px,1.6vw,16px);left:50%;width:calc(100% + 50px);height:12px;transform:translateX(-50%);border-radius:6px;
    background:linear-gradient(180deg,#e3a466,#c88a4b 50%,#7e4a22);box-shadow:0 6px 12px #0008}
  .big404 .hg{position:relative;display:inline-block;transform-origin:50% calc(-1 * clamp(38px,6.6vw,60px));animation:hang var(--t) ease-in-out infinite;animation-delay:var(--d);}
  .big404 .hg::before{content:"";position:absolute;left:50%;bottom:100%;width:1.5px;height:clamp(38px,6.6vw,60px);background:#e6dfcfaa}
  .big404 .hg::after{content:"";position:absolute;left:calc(50% - 4px);top:-4px;width:8px;height:8px;border-radius:50%;background:var(--yolk);box-shadow:0 0 0 2px var(--ink);z-index:2}
  @keyframes hang{0%,100%{transform:rotate(calc(var(--a) * -1))}50%{transform:rotate(var(--a))}}

  /* wanted poster */
  .poster{position:relative;width:min(400px,100%);background:#efe4c9;color:var(--ink);padding:clamp(14px,2.4vh,22px) 24px clamp(12px,2vh,18px);transform:rotate(-1.6deg);
    box-shadow:0 18px 40px #000c;background-image:radial-gradient(circle at 20% 10%,#0000000d 0 30%,transparent 60%),radial-gradient(circle at 90% 90%,#5a331722 0 20%,transparent 50%);
    clip-path:polygon(0 2%,6% 0,20% 1.5%,38% 0,55% 1.2%,74% 0,92% 1.6%,100% 0,99% 30%,100% 62%,98.6% 100%,80% 98.4%,60% 100%,40% 98.6%,18% 100%,0 98.6%,1.2% 70%,0 36%)}
  .poster .pin{position:absolute;top:8px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7a6e,#b3241c);box-shadow:0 2px 3px #0008}
  .poster .pin.l{left:12px}.poster .pin.r{right:12px}
  .wanted{font-size:min(clamp(28px,5.4vw,42px),5.4vh);--g:3px;justify-content:center;margin-bottom:8px}
  .poster h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,32px);line-height:1.1;margin:0 0 10px}
  .poster dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 auto;max-width:300px;text-align:left;font-family:var(--f-type);font-size:14px}
  .poster dt{color:#6b5a45}
  .poster dd{margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poster .gone{margin:10px 0 0;font-family:var(--f-type);font-size:14px;color:#5a4a36}

  /* Pinokkio looking around, free-standing so nothing overlaps */
  .seek{position:relative;width:min(16vh,130px);aspect-ratio:1;max-width:100%}
  .pino{position:absolute;inset:0}
  .pino svg{width:100%;height:100%;overflow:visible;animation:look 3.2s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes look{0%,100%{transform:rotate(0)}25%,45%{transform:rotate(-12deg) translateX(-6px)}65%,85%{transform:rotate(10deg) translateX(6px)}}
  .qm{position:absolute;font-family:var(--f-display);color:var(--yolk);font-size:clamp(22px,3.4vh,30px);opacity:0;animation:qpop 3.2s ease-in-out infinite}
  .qm1{left:-24%;top:0;animation-delay:.6s}.qm2{right:-20%;top:-8%;animation-delay:2.2s;color:var(--paper)}
  @keyframes qpop{0%,10%{opacity:0;transform:translateY(8px) scale(.6)}20%,40%{opacity:1;transform:none}55%,100%{opacity:0;transform:translateY(-10px)}}

  .lost-text{display:grid;gap:12px;justify-items:center;max-width:52ch;position:relative;z-index:2}
  .lost-text p{margin:0;color:#d3cde0}
  .sm{font-family:var(--f-type);font-size:13px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

  <symbol id="i-yt" viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 00-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 001 7.2 31 31 0 00.5 12 31 31 0 001 16.8a3 3 0 002.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 002.1-2.1 31 31 0 00.5-4.8 31 31 0 00-.5-4.8zM9.7 15.1V8.9L15.4 12z"/></symbol>

  <symbol id="i-sp" viewBox="0 0 24 24"><path d="M12 1a11 11 0 100 22 11 11 0 000-22zm5 15.9a.7.7 0 01-.9.2c-2.6-1.6-5.8-1.9-9.6-1a.7.7 0 11-.3-1.3c4.2-1 7.7-.6 10.6 1.2.3.2.4.6.2.9zm1.3-3a.9.9 0 01-1.2.3c-2.9-1.8-7.4-2.3-10.9-1.3a.9.9 0 11-.5-1.7c4-1.2 9-.6 12.3 1.5.4.2.6.8.3 1.2zm.1-3.1C14.9 8.7 9.2 8.5 5.9 9.5a1.1 1.1 0 11-.6-2.1c3.8-1.2 10.1-.9 14.1 1.4a1.1 1.1 0 11-1 1.9z"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><path d="M12 7.3a4.7 4.7 0 100 9.4 4.7 4.7 0 000-9.4zm0 7.7a3 3 0 110-6 3 3 0 010 6zm6-7.9a1.1 1.1 0 11-2.2 0 1.1 1.1 0 012.2 0zM16.8 1H7.2A6.2 6.2 0 001 7.2v9.6A6.2 6.2 0 007.2 23h9.6a6.2 6.2 0 006.2-6.2V7.2A6.2 6.2 0 0016.8 1zm4.2 15.8a4.2 4.2 0 01-4.2 4.2H7.2A4.2 4.2 0 013 16.8V7.2A4.2 4.2 0 017.2 3h9.6A4.2 4.2 0 0121 7.2z"/></symbol>

<a class="home404" href="/" aria-label="ONEX home"><img src="/assets/images/onex-letters.webp" alt="ONEX"></a>
<div class="lang lang404" role="group" aria-label="Kies taal"><button type="button" data-lang="nl" aria-pressed="true">NL</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>

<main class="scene">
  <div class="ransom big404" aria-label="404"></div>

  <div class="poster">
    <i class="pin l"></i><i class="pin r"></i>
    <div class="ransom wanted" id="wanted" aria-label="Gezocht"></div>
    <h1 data-t>Deze pagina</h1>
    <dl>
      <dt data-t>Adres:</dt><dd id="path">/</dd>
    </dl>
    <p class="gone" data-t>Bestaat niet meer, of is verhuisd.</p>
  </div>

  <div class="seek" aria-hidden="true">
    <span class="qm qm1">?</span><span class="qm qm2">?</span>
    <div class="pino"><svg viewBox="88 36 150 156"><use href="#pHead" width="320" height="560"/></svg></div>
  </div>

  <div class="lost-text">
    <div class="btns" style="justify-content:center">
      <a class="btn" href="/" data-t>Terug naar home</a>
    </div>
  </div>
</main>

<script>
(function(){
  const EN={
    "Deze pagina":"This page","Adres:":"Address:","Bestaat niet meer, of is verhuisd.":"Doesn't exist anymore, or has moved.",
    "Terug naar home":"Back to home","Kies taal":"Choose language",
    "GEZOCHT":"WANTED","Gezocht":"Wanted"
  };
  let lang="nl";
  try{const s=localStorage.getItem("onex-lang");if(s)lang=s;else if(!/^nl/i.test(navigator.language||"nl"))lang="en";}catch(e){}
  const T=s=>lang==="en"&&EN[s]?EN[s]:s;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  const styles=[["#cfcfcf","#141414","'Abril Fatface',Georgia,serif"],["#2f6fd0","#dce7f6","'Bowlby One','Arial Black',sans-serif"],["#e8b021","#d6312a","'Special Elite','Courier New',monospace"],
    ["#ece6d8","#0f0c19","'Rubik Mono One','Arial Black',sans-serif"],["#d6312a","#ece6d8","'Playfair Display',Georgia,serif"],["#4a2a22","#ece6d8","'Abril Fatface',Georgia,serif"]];
  function letter(ch,i){const l=document.createElement("span");l.className="l";l.textContent=ch;const st=styles[i%styles.length];
    l.style.background=st[0];l.style.color=st[1];l.style.fontFamily=st[2];return l}

  /* hanging 404 */
  const big=document.querySelector(".big404");
  [..."404"].forEach((ch,i)=>{const hg=document.createElement("span");hg.className="hg";
    hg.style.setProperty("--a",[3,4,2.5][i]+"deg");hg.style.setProperty("--t",[2.6,2.1,2.9][i]+"s");hg.style.setProperty("--d",(-i*.7)+"s");
    hg.appendChild(letter(ch,[0,1,2][i]));big.appendChild(hg)});

  /* ransom "GEZOCHT" */
  const wanted=document.getElementById("wanted");
  function renderWanted(){wanted.textContent="";const w=document.createElement("span");w.className="w";
    [...T("GEZOCHT")].forEach((ch,i)=>{const l=letter(ch,(i*5+2)%styles.length);l.style.transform=`rotate(${[-5,3,-2,4,-4,2,-3][i%7]}deg)`;w.appendChild(l)});wanted.appendChild(w)}

  /* which address was asked for */
  const pth=document.getElementById("path");pth.textContent=decodeURIComponent(location.pathname)||"/";pth.title=pth.textContent;

  /* texts */
  const nodes=[...document.querySelectorAll("[data-t]")].map(el=>[el,el.textContent.trim()]);
  function apply(){
    document.documentElement.lang=lang;
    nodes.forEach(([el,nl])=>el.textContent=T(nl));
    renderWanted();
    document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  }
  document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("onex-lang",lang)}catch(e){};apply()}));
  apply();

  /* night sky like the rest of the site */
  (function(){const sky=document.createElement("div");sky.className="sky";sky.setAttribute("aria-hidden","true");
    for(let i=0;i<(innerWidth<700?55:110);i++){const st=document.createElement("i");st.className="st"+(Math.random()<.15?" y":"");const big=Math.random()<.08;
      st.style.left=Math.random()*100+"%";st.style.top=Math.random()*100+"%";st.style.setProperty("--s",(big?2.6:0.8+Math.random()*1.4)+"px");
      st.style.setProperty("--o",(big?.95:.35+Math.random()*.5).toFixed(2));st.style.setProperty("--dur",(2.5+Math.random()*4).toFixed(1)+"s");st.style.setProperty("--dl",(-Math.random()*6).toFixed(1)+"s");sky.appendChild(st)}
    document.body.prepend(sky)})();
})();
</script>
</body>
</html>
